# Default values for asie-inference.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# This will set the replicaset count more information can be found here: https://kubernetes.io/docs/concepts/workloads/controllers/replicaset/
replicaCount: 1

# This sets the namespace for the deployment.
# namespace: asie-inference-namespace

# This sets the container image more information can be found here: https://kubernetes.io/docs/concepts/containers/images/
image:
  repository: asie-inference
  # This sets the pull policy for images.
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: latest

# This is for the secrets for pulling an image from a private repository more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/
imagePullSecrets: []
# This is to override the chart name.
nameOverride: ""
fullnameOverride: ""

# This section builds out the service account more information can be found here: https://kubernetes.io/docs/concepts/security/service-accounts/
serviceAccount:
  # Specifies whether a service account should be created.
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account.
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template.
  name: ""

aws:
  region: ap-south-1

# S3 location the initContainer syncs into /models before the app starts.
models:
  s3Uri: "asie-platform-818111885210/models"

# Deployed model versions. Each is an MLflow run_id, which is also the S3
# prefix under models/ holding that model's weights -- one identifier from
# training through to the inference_logs row.
#
# Two jobs at once: the initContainer fetches exactly these prefixes, and both
# are stamped onto the pod template as annotations so changing either forces a
# rolling update (see templates/deployment.yaml). Overridden by
# gitops/values/inference.yaml; defaults keep the chart renderable standalone.
model:
  primaryVersion: "unset"
  # Empty or "unset" disables shadow inference entirely -- the app already
  # treats a missing shadow model as optional.
  shadowVersion: "unset"

# Secret (created by eks/db-bootstrap/create-app-secrets.sh) holding the
# Postgres connection string for asie_app.
database:
  secretName: asie-app-db
  secretKey: ASIE_DATABASE_URL

mlflow:
  trackingUri: "http://asie-mlflow.mlflow.svc.cluster.local:5000"

# Prometheus Operator scrape config. Disabled by default so the chart still
# installs on a cluster without the ServiceMonitor CRD; asie.sh turns it on
# once kube-prometheus-stack is present.
serviceMonitor:
  enabled: false
  path: /metrics
  # 30s, not the 15s prometheus.yml uses locally -- each scrape runs a query
  # against RDS (get_latest_drift_record), and that cost is multiplied by the
  # HPA replica count.
  interval: 30s
  scrapeTimeout: 10s
  additionalLabels: {}

initContainer:
  # AWS's own public registry, not Docker Hub. Two reasons: `amazon/aws-cli:2`
  # does not exist as a tag on Docker Hub at all (the pull failed with
  # "not found", stranding the pod in Init:ImagePullBackOff), and public.ecr.aws
  # has no anonymous pull rate limit, unlike Docker Hub.
  image: "public.ecr.aws/aws-cli/aws-cli:latest"

# Progressive delivery. Off by default so the chart still installs as a plain
# Deployment on a cluster without the Argo Rollouts CRDs; gitops/values turns
# it on where the controller exists.
canary:
  enabled: false
  # The ALB Ingress whose target-group weights the controller rewrites. Lives
  # in eks/ingress.yaml, outside this chart.
  ingressName: asie-inference
  # Traffic weight ladder. 20 -> 50 -> 100, with an analysis gate after each
  # increase rather than a fixed pause: a timer only proves that time passed.
  steps:
    - setWeight: 20
    - analysis: true
    - setWeight: 50
    - analysis: true
  analysis:
    prometheusAddress: http://kube-prom-prometheus.monitoring.svc.cluster.local:9090
    # Rate window. 2m against a 30s scrape gives four samples -- enough that
    # one slow scrape does not swing the ratio.
    window: 2m
    initialDelay: 60s
    interval: 60s
    count: 3
    # 0.99, not 1.0. Demanding a perfect success rate makes any single 5xx
    # from an unrelated cause abort the rollout, and this endpoint returns 422
    # for malformed input by design -- those are 4xx and already excluded, but
    # the margin matters for genuine transients.
    minSuccessRate: 0.99

# Drain window before the container stops, in seconds. Sized against the ALB's
# target deregistration, not against application shutdown: the app has nothing
# to flush, but the load balancer keeps routing to a deregistering target for a
# few seconds. 20s covers the observed window with margin.
preStopDelaySeconds: 20

# This is for setting Kubernetes Annotations to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/
podAnnotations: {}
# This is for setting Kubernetes Labels to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/
podLabels: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

# This is for setting up a service more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/
service:
  # ClusterIP, not LoadBalancer: eks/ingress.yaml puts this behind the shared
  # ALB. Leaving it as LoadBalancer would provision a second, separate ELB
  # alongside the ALB -- exactly the per-service-ELB cost AWS_ARCHITECTURE.md
  # §6 exists to avoid, and the consolidation would save nothing.
  type: ClusterIP
  # This sets the ports more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#field-spec-ports
  port: 80

# This block is for setting up the ingress for more information can be found here: https://kubernetes.io/docs/concepts/services-networking/ingress/
ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
    # - secretName: chart-example-tls
    #   hosts:
    #     - chart-example.local

# -- Expose the service via gateway-api HTTPRoute
# Requires Gateway API resources and suitable controller installed within the cluster
# (see: https://gateway-api.sigs.k8s.io/guides/)
httpRoute:
  # HTTPRoute enabled.
  enabled: false
  # HTTPRoute annotations.
  annotations: {}
  # Which Gateways this Route is attached to.
  parentRefs:
  - name: gateway
    sectionName: http
    # namespace: default
  # Hostnames matching HTTP header.
  hostnames:
  - chart-example.local
  # List of rules and filters applied.
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /headers
  #   filters:
  #   - type: RequestHeaderModifier
  #     requestHeaderModifier:
  #       set:
  #       - name: My-Overwrite-Header
  #         value: this-is-the-only-value
  #       remove:
  #       - User-Agent
  # - matches:
  #   - path:
  #       type: PathPrefix
  #       value: /echo
  #     headers:
  #     - name: version
  #       value: v2

resources:
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  limits:
    cpu: "3"
    memory: "3Gi"
  requests:
    cpu: "1.5"
    memory: "1.5Gi"

# This is to setup the liveness and readiness probes more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/
livenessProbe:
  httpGet:
    path: /health
    port: 8000
readinessProbe:
  httpGet:
    path: /health
    port: 8000

# This section is for setting up autoscaling more information can be found here: https://kubernetes.io/docs/concepts/workloads/autoscaling/
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

# This section is for HPA metrics.
hpa:
  enabled: true
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 50

# Additional volumes on the output Deployment definition.
volumes: []
  # - name: foo
  #   secret:
  #     secretName: mysecret
  #     optional: false

# Additional volumeMounts on the output Deployment definition.
volumeMounts: []
  # - name: foo
  #   mountPath: "/etc/foo"
  #   readOnly: true

nodeSelector: {}

tolerations: []

affinity: {}
