apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}
data:
  PRIMARY_MODEL_PATH: "/models/primary/model"
  PRIMARY_TOKENIZER_PATH: "/models/primary/tokenizer"

  SHADOW_MODEL_PATH: "/models/shadow/model"
  SHADOW_TOKENIZER_PATH: "/models/shadow/tokenizer"

  INFERENCE_DEVICE: "cpu"
  APP_ENV: "development"

  # Read by the initContainer (which S3 prefixes to fetch) AND by the app
  # (which version to record on every inference_logs row). One value, so the
  # weights on disk and the version in the database cannot disagree.
  PRIMARY_MODEL_VERSION: {{ .Values.model.primaryVersion | quote }}
  SHADOW_MODEL_VERSION: {{ .Values.model.shadowVersion | quote }}

  MODEL_S3_URI: {{ .Values.models.s3Uri | quote }}
  AWS_REGION: {{ .Values.aws.region | quote }}
  AWS_DEFAULT_REGION: {{ .Values.aws.region | quote }}
  MLFLOW_TRACKING_URI: {{ .Values.mlflow.trackingUri | quote }}
