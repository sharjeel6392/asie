{{- if not .Values.canary.enabled }}
# Plain Deployment: the rolling-update path, used when canary delivery is off.
# Argo Rollouts replaces this object entirely rather than wrapping it, so the
# two are mutually exclusive -- both present would mean two controllers
# managing two ReplicaSets of the same app behind one Service.
#
# The pod spec lives in _helpers.tpl and is shared with rollout.yaml.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    app: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}
  template:
{{ include "asie-inference.podTemplate" . | indent 4 }}
{{- end }}
