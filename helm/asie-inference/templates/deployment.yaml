apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    app: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      initContainers:
      - name: fetch-models
        image: {{ .Values.initContainer.image }}
        # IRSA on the pod's service account applies to init containers too —
        # no separate credential wiring needed here.
        command: ["aws", "s3", "sync", "s3://$(MODEL_S3_URI)/", "/models/", "--only-show-errors"]
        envFrom:
        - configMapRef:
            name: {{ .Release.Name }}
        volumeMounts:
        - name: models
          mountPath: /models
      containers:
      - name: "{{ .Release.Name }}-container"
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}" #asie-inference-k8s:latest
        imagePullPolicy: IfNotPresent
        envFrom:
        - configMapRef:
            name: {{ .Release.Name }}
        env:
        - name: ASIE_DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: {{ .Values.database.secretName }}
              key: {{ .Values.database.secretKey }}
        ports:
        # Named so the Service can target it by name (targetPort: http),
        # which is what lets the ServiceMonitor reference it.
        - name: http
          containerPort: 8000
        volumeMounts:
        - name: models
          mountPath: /models
        {{- with .Values.volumeMounts }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        resources:
          requests:
            memory: {{ .Values.resources.requests.memory }}
            cpu: {{ .Values.resources.requests.cpu }}
          limits:
            memory: {{ .Values.resources.limits.memory }}
            cpu: {{ .Values.resources.limits.cpu}}
        # Model load into RAM after a cold start can take longer than the
        # liveness probe's initialDelaySeconds below — startupProbe holds
        # off liveness checks (up to 30x10s=300s) until the app is actually
        # ready, so a slow-but-healthy start doesn't get killed as if hung.
        startupProbe:
          httpGet:
            path: {{ .Values.readinessProbe.httpGet.path }}
            port: {{ .Values.readinessProbe.httpGet.port }}
          failureThreshold: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: {{ .Values.readinessProbe.httpGet.path}}
            port: {{ .Values.readinessProbe.httpGet.port}}
          initialDelaySeconds: 5
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: {{ .Values.livenessProbe.httpGet.path }}
            port: {{ .Values.livenessProbe.httpGet.port}}
          initialDelaySeconds: 15
          periodSeconds: 10
      volumes:
      - name: models
        emptyDir:
          sizeLimit: 2Gi
      {{- with .Values.volumes }}
      {{- toYaml . | nindent 6 }}
      {{- end }}