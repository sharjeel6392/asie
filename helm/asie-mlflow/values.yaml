image:
  repository: 818111885210.dkr.ecr.ap-south-1.amazonaws.com/asie-mlflow-repo
  tag: latest
  pullPolicy: IfNotPresent

serviceAccount:
  name: mlflow-irsa-sa

database:
  secretName: mlflow-db
  secretKey: MLFLOW_BACKEND_STORE_URI

artifactRoot: "s3://asie-platform-818111885210/mlflow-artifacts/"
aws:
  region: ap-south-1

# Host headers this server will accept (MLflow 3.x DNS-rebinding guard).
# Every in-cluster form Airflow / the inference pods may resolve it by, plus
# localhost for `kubectl port-forward`. Deliberately NOT "*" -- that turns the
# protection off entirely.
allowedHosts: "asie-mlflow.mlflow.svc.cluster.local:5000,asie-mlflow.mlflow.svc.cluster.local,asie-mlflow.mlflow:5000,asie-mlflow.mlflow,asie-mlflow:5000,asie-mlflow,localhost:5000,localhost,127.0.0.1:5000,127.0.0.1"

# 1 gunicorn worker. Was 2, which OOMKilled (exit 137) against the 1Gi limit
# below: MLflow 3.x starts a huey job consumer with 5 threads per worker plus
# a periodic scheduler, so the per-worker footprint is far larger than 2.x's.
# One worker is ample for a single-team tracking server.
workers: 1

service:
  type: ClusterIP
  port: 5000

resources:
  requests:
    cpu: "300m"
    memory: "512Mi"
  limits:
    cpu: "1"
    # 2Gi, not 1Gi: the server was OOMKilled at 1Gi even before serving a
    # request. MLflow 3.x runs background job infrastructure (huey consumers)
    # in-process that 2.x did not.
    memory: "2Gi"
