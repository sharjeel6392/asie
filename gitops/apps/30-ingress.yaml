# Wave 3 -- last. The ALB Ingress and the PrometheusRule/dashboard both
# reference objects created by earlier waves: the Ingress targets the
# inference and Grafana Services, and monitoring-rules.yaml is a
# PrometheusRule, whose CRD arrives in wave 1.
#
# Syncing these first is not merely out of order -- the AWS Load Balancer
# Controller would provision an ALB pointing at Services that do not exist and
# health-check every target as failed.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: asie-ingress-and-rules
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: git@github.com:sharjeel6392/asie.git
    targetRevision: gitops-deployment
    path: eks
    directory:
      recurse: false
      # Explicit allow-list for the same reason as 00-namespaces.yaml: eks/
      # is a mixed directory of manifests, Helm values and eksctl configs.
      include: "{ingress.yaml,monitoring-rules.yaml,grafana-dashboard-asie.yaml}"
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
