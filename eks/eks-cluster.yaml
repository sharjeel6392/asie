apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: asie-cluster
  region: ap-south-1

# OIDC provider for the cluster — required for IRSA (pods assuming IAM
# roles), used by the inference/Airflow/MLflow workloads and the AWS Load
# Balancer Controller. Baked in here instead of a separate
# `eksctl utils associate-iam-oidc-provider` call after creation.
iam:
  withOIDC: true

# The EBS CSI driver is NOT installed by default, and since Kubernetes 1.23
# the in-tree EBS provisioner is gone -- so without this every PVC stays
# Pending forever. kube-prometheus-stack (Day 6) wants persistent volumes for
# Prometheus and Grafana, so this has to exist before that install.
# wellKnownPolicies makes eksctl create the controller's IRSA role for us.
addons:
  - name: aws-ebs-csi-driver
    wellKnownPolicies:
      ebsCSIController: true

vpc:
  id: <YOUR_VPC_ID>

  subnets:
    public:
      ap-south-1a:
        id: <YOUR_PUBLIC1_SUBNET_ID>
      ap-south-1b:
        id: <YOUR_PUBLIC2_SUBNET_ID>

    private:
      ap-south-1a:
        id: <YOUR_PRIVATE1_SUBNET_ID>
      ap-south-1b:
        id: <YOUR_PRIVATE2_SUBNET_ID>

managedNodeGroups:
  - name: asie-nodes
    # t3.xlarge, not t3.large — t3.medium/large both cap at 2 vCPU (only RAM
    # differs); xlarge is the first step up in CPU (4 vCPU/16GiB), needed to
    # fit inference (up to 3 HPA replicas x 1.5 vCPU) alongside Airflow,
    # MLflow, and kube-prometheus-stack on the same 2 nodes.
    instanceType: t3.xlarge

    desiredCapacity: 2
    minSize: 1
    maxSize: 3

    privateNetworking: true

    subnets:
      - <YOUR_PRIVATE1_SUBNET_ID>
      - <YOUR_PRIVATE2_SUBNET_ID>

    iam:
      withAddonPolicies:
        autoScaler: true
        albIngress: true
        cloudWatch: true

    # No `ssh:` block, no key pair — Session Manager access replaces the
    # bastion + SSH key (aws-provision/modules/ec2, removed Day 2). eksctl
    # attaches AmazonSSMManagedInstanceCore to managed node groups by
    # default now, so nothing further is needed here.